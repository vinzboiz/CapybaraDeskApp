<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <title>Capy Desktop Pet</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
    }
    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: transparent;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }
    #pet-canvas {
      position: absolute;
      top: 0;
      left: 0;
      display: block;
      width: 100vw;
      height: 100vh;
      cursor: default;
      z-index: 1;
    }
    /* Floating Vertical Dashboard Pill */
    #dashboard {
      position: fixed;
      right: 18px;
      bottom: 85px;
      z-index: 9999;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 7px;
      background: rgba(22, 18, 32, 0.86);
      backdrop-filter: blur(14px);
      -webkit-backdrop-filter: blur(14px);
      border: 1px solid rgba(255, 255, 255, 0.18);
      border-radius: 26px;
      padding: 7px 5px;
      box-shadow: 0 8px 24px rgba(0, 0, 0, 0.45), inset 0 1px 0 rgba(255, 255, 255, 0.15);
      transition: background 0.25s ease, border-color 0.25s ease, box-shadow 0.25s ease;
      cursor: grab;
    }
    #dashboard.is-dragging {
      transition: none !important;
      cursor: grabbing !important;
    }
    #dashboard:hover {
      background: rgba(28, 22, 42, 0.96);
      border-color: rgba(255, 200, 80, 0.4);
      box-shadow: 0 10px 28px rgba(0, 0, 0, 0.55);
    }
    .dash-btn {
      display: flex;
      align-items: center;
      justify-content: center;
      width: 32px;
      height: 32px;
      background: transparent;
      border: none;
      outline: none;
      color: #94a3b8;
      border-radius: 50%;
      cursor: pointer;
      transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1);
      user-select: none;
      padding: 0;
    }
    .dash-btn .icon {
      font-size: 15px;
      line-height: 1;
      transition: transform 0.2s ease;
    }
    .dash-btn:hover {
      background: rgba(255, 255, 255, 0.12);
      color: #ffffff;
      transform: scale(1.1);
    }
    .dash-btn.active {
      background: linear-gradient(135deg, #f59e0b, #d97706);
      color: #ffffff;
      box-shadow: 0 2px 10px rgba(245, 158, 11, 0.45);
      transform: scale(1.05);
    }
    .dash-btn.active.bath {
      background: linear-gradient(135deg, #06b6d4, #0284c7);
      box-shadow: 0 2px 10px rgba(6, 182, 212, 0.45);
    }
    .dash-btn.active.work {
      background: linear-gradient(135deg, #8b5cf6, #6d28d9);
      box-shadow: 0 2px 10px rgba(139, 92, 246, 0.45);
    }
    .dash-btn.active.settings {
      background: linear-gradient(135deg, #ec4899, #db2777);
      box-shadow: 0 2px 10px rgba(236, 72, 153, 0.45);
    }
    .dash-btn.active.hide {
      background: linear-gradient(135deg, #10b981, #059669);
      box-shadow: 0 2px 10px rgba(16, 185, 129, 0.45);
    }
    .dash-btn.toggle-dash {
      font-size: 13px;
      opacity: 0.65;
      margin-top: 2px;
      border-top: 1px solid rgba(255, 255, 255, 0.1);
      width: 28px;
      height: 22px;
      border-radius: 11px;
    }
    .dash-btn.toggle-dash:hover {
      opacity: 1;
      background: rgba(255, 255, 255, 0.12);
      transform: none;
    }
    #dashboard.collapsed {
      padding: 4px;
      gap: 0;
      border-radius: 50%;
      width: 36px;
      height: 36px;
      min-width: 36px;
      min-height: 36px;
      background: rgba(22, 18, 32, 0.88);
      border: 1px solid rgba(255, 255, 255, 0.25);
      box-shadow: 0 6px 16px rgba(0, 0, 0, 0.45);
      justify-content: center;
      align-items: center;
      overflow: hidden;
    }
    #dashboard.collapsed:hover {
      border-color: rgba(255, 200, 80, 0.6);
      transform: scale(1.08);
    }
    #dashboard.collapsed .dash-grip,
    #dashboard.collapsed #btn-roam,
    #dashboard.collapsed #btn-bath,
    #dashboard.collapsed #btn-work,
    #dashboard.collapsed #btn-hide,
    #dashboard.collapsed #btn-settings {
      display: none !important;
    }
    #dashboard.collapsed .dash-btn.toggle-dash {
      margin: 0;
      border: none;
      width: 28px;
      height: 28px;
      border-radius: 50%;
      opacity: 1;
      color: #fbbf24;
      display: flex !important;
      align-items: center;
      justify-content: center;
    }
    #dashboard.collapsed .dash-btn.toggle-dash .icon {
      font-size: 16px;
    }

    /* Modal Cài đặt Glassmorphism */
    #settings-modal {
      position: fixed;
      right: 64px;
      bottom: 85px;
      width: 295px;
      background: rgba(18, 14, 30, 0.94);
      backdrop-filter: blur(18px);
      -webkit-backdrop-filter: blur(18px);
      border: 1px solid rgba(255, 255, 255, 0.18);
      border-radius: 18px;
      box-shadow: 0 16px 36px rgba(0, 0, 0, 0.6), inset 0 1px 0 rgba(255, 255, 255, 0.15);
      color: #f1f5f9;
      z-index: 10000;
      padding: 15px 16px;
      font-size: 13px;
      display: flex;
      flex-direction: column;
      gap: 12px;
      transition: all 0.25s cubic-bezier(0.16, 1, 0.3, 1);
    }
    #settings-modal.modal-hidden {
      display: none !important;
      opacity: 0;
      pointer-events: none;
    }
    .modal-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      border-bottom: 1px solid rgba(255, 255, 255, 0.1);
      padding-bottom: 8px;
    }
    .modal-title {
      font-weight: 600;
      font-size: 14px;
      display: flex;
      align-items: center;
      gap: 6px;
      color: #fbbf24;
    }
    .modal-close-btn {
      background: none;
      border: none;
      color: #94a3b8;
      font-size: 18px;
      cursor: pointer;
      padding: 0 4px;
      line-height: 1;
      border-radius: 4px;
      transition: color 0.15s ease;
    }
    .modal-close-btn:hover {
      color: #ffffff;
    }
    .setting-group {
      background: rgba(255, 255, 255, 0.04);
      border: 1px solid rgba(255, 255, 255, 0.08);
      border-radius: 12px;
      padding: 10px 12px;
      display: flex;
      flex-direction: column;
      gap: 8px;
    }
    .group-title {
      font-weight: 600;
      font-size: 12px;
      color: #cbd5e1;
      display: flex;
      align-items: center;
      gap: 5px;
    }
    .setting-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
    }
    .setting-row label {
      color: #94a3b8;
      font-size: 12px;
      cursor: pointer;
    }
    .time-inputs {
      display: flex;
      align-items: center;
      gap: 6px;
    }
    .time-item {
      display: flex;
      align-items: center;
      gap: 4px;
      font-size: 11px;
      color: #cbd5e1;
    }
    input[type="time"] {
      background: rgba(0, 0, 0, 0.4);
      border: 1px solid rgba(255, 255, 255, 0.2);
      border-radius: 6px;
      color: #ffffff;
      padding: 3px 5px;
      font-size: 11px;
      font-family: inherit;
      outline: none;
    }
    input[type="time"]:focus, select:focus {
      border-color: #f59e0b;
    }
    select {
      background: #1e1b2e;
      border: 1px solid rgba(255, 255, 255, 0.2);
      border-radius: 6px;
      color: #ffffff;
      padding: 4px 6px;
      font-size: 12px;
      font-family: inherit;
      outline: none;
      cursor: pointer;
      width: 150px;
    }
    select option {
      background: #181426;
      color: #ffffff;
    }
    .setting-hint {
      font-size: 11px;
      color: #64748b;
      line-height: 1.35;
    }
    .setting-hint.highlight {
      color: #38bdf8;
    }
    .modal-actions {
      display: flex;
      justify-content: flex-end;
      gap: 8px;
      margin-top: 2px;
    }
    .dash-grip {
      width: 24px;
      height: 12px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 2.5px;
      cursor: grab;
      padding: 2px 0;
      opacity: 0.45;
      transition: opacity 0.2s ease;
    }
    .dash-grip:hover {
      opacity: 0.95;
    }
    .dash-grip:active {
      cursor: grabbing;
    }
    .dash-grip span {
      display: block;
      width: 14px;
      height: 2px;
      background: #e2e8f0;
      border-radius: 2px;
    }
    .danger-btn {
      width: 100%;
      background: rgba(225, 29, 72, 0.18);
      border: 1px solid rgba(244, 63, 94, 0.35);
      color: #fda4af;
      font-weight: 600;
      padding: 6px 12px;
      border-radius: 8px;
      font-size: 11.5px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      transition: all 0.2s ease;
      margin-top: 4px;
    }
    .danger-btn:hover {
      background: rgba(225, 29, 72, 0.35);
      border-color: rgba(244, 63, 94, 0.6);
      color: #ffffff;
      transform: translateY(-1px);
    }
    .danger-btn:active {
      transform: translateY(0);
    }
    .primary-btn {
      background: linear-gradient(135deg, #f59e0b, #d97706);
      border: none;
      color: #ffffff;
      font-weight: 600;
      padding: 6px 14px;
      border-radius: 8px;
      font-size: 12px;
      cursor: pointer;
      transition: all 0.2s ease;
      box-shadow: 0 2px 8px rgba(245, 158, 11, 0.35);
    }
    .primary-btn:hover {
      transform: translateY(-1px);
      box-shadow: 0 4px 12px rgba(245, 158, 11, 0.5);
    }
    /* Checkbox switch */
    input[type="checkbox"] {
      cursor: pointer;
      accent-color: #f59e0b;
      width: 16px;
      height: 16px;
    }
  </style>
</head>
<body>
  <canvas id="pet-canvas"></canvas>

  <div id="dashboard">
    <div class="dash-grip" id="dash-grip" title="Giữ chuột để di chuyển thanh công cụ">
      <span></span>
      <span></span>
    </div>
    <button id="btn-roam" class="dash-btn active" title="Đi dạo">
      <span class="icon">🌿</span>
    </button>
    <button id="btn-bath" class="dash-btn" title="Đi tắm">
      <span class="icon">🛁</span>
    </button>
    <button id="btn-work" class="dash-btn" title="Làm việc">
      <span class="icon">💻</span>
    </button>
    <button id="btn-hide" class="dash-btn" title="Trốn">
      <span class="icon">🫣</span>
    </button>
    <button id="btn-settings" class="dash-btn" title="Cài đặt">
      <span class="icon">⚙️</span>
    </button>
    <button id="btn-toggle-dash" class="dash-btn toggle-dash" title="Thu nhỏ thanh công cụ">
      <span class="icon">😣</span>
    </button>
  </div>

  <!-- Modal Cài đặt Giờ làm việc, Nhắc uống nước & Tốc độ chạy -->
  <div id="settings-modal" class="modal-hidden">
    <div class="modal-header">
      <div class="modal-title"><span>⚙️</span> Cài Đặt Capy</div>
      <button id="modal-close" class="modal-close-btn">&times;</button>
    </div>

    <!-- 1. BỘ ĐẾM THỜI GIAN LÀM VIỆC TẬP TRUNG -->
    <div class="setting-group">
      <div class="group-title">💻 Thời gian làm việc tập trung</div>
      <div class="setting-row">
        <label for="work-focus-toggle">Khóa tập trung:</label>
        <input type="checkbox" id="work-focus-toggle" checked>
      </div>
      <div class="setting-row">
        <label for="work-duration-select">Thời lượng:</label>
        <select id="work-duration-select">
          <option value="30">⚡ 30 giây</option>
          <option value="900">15 phút</option>
          <option value="1800">30 phút</option>
          <option value="3600" selected>1 tiếng</option>
          <option value="7200">2 tiếng</option>
          <option value="10800">3 tiếng</option>
          <option value="14400">4 tiếng</option>
          <option value="18000">5 tiếng</option>
          <option value="21600">6 tiếng</option>
          <option value="25200">7 tiếng</option>
          <option value="28800">8 tiếng</option>
        </select>
      </div>
      <div class="setting-row">
        <label for="computer-mode-select">Chế độ ngồi máy:</label>
        <select id="computer-mode-select">
          <option value="focus" selected>🔥 Làm việc tập trung</option>
          <option value="chill">☕ Chỉ ngồi máy tính (Chill)</option>
        </select>
      </div>
      <div class="setting-hint" id="work-status-text">
        Tính từ lúc bắt đầu ngồi vào bàn cho đến hết khoảng thời gian đã chọn.
      </div>
      <!-- Nút Hủy / Dừng làm việc ngay -->
      <button type="button" id="btn-cancel-work" class="danger-btn" title="Dừng phiên làm việc và cho Capy nghỉ ngơi">
        ⏹ Dừng làm việc ngay
      </button>
    </div>

    <!-- 2. NHẮC UỐNG NƯỚC -->
    <div class="setting-group">
      <div class="group-title">💧 Nhắc uống nước</div>
      <div class="setting-row">
        <label for="water-interval-select">Chu kỳ:</label>
        <select id="water-interval-select">
          <option value="30">⚡ 30 giây</option>
          <option value="1800">⏱️ Mỗi 30 phút</option>
          <option value="3600" selected>⏰ Mỗi 1 tiếng</option>
          <option value="7200">⏳ Mỗi 2 tiếng</option>
        </select>
      </div>
      <div class="setting-hint highlight">
        Chai nước sẽ xuất hiện, kèm lời nhắc cho tới khi bạn nhấn vào Capy!
      </div>
    </div>

    <!-- 3. TỐC ĐỘ DI CHUYỂN CỦA CAPYBARA -->
    <div class="setting-group">
      <div class="group-title">🐾 Tốc độ đi dạo</div>
      <div class="setting-row">
        <label for="walk-speed-select">Tốc độ:</label>
        <select id="walk-speed-select">
          <option value="1.35">🐢 Thư thả (Chậm)</option>
          <option value="1.55" selected>🐾 Bình thường (Chuẩn)</option>
          <option value="1.95">🏃 Nhanh nhẹn</option>
          <option value="2.45">⚡ Siêu tốc</option>
        </select>
      </div>
    </div>

    <div class="modal-actions">
      <button id="btn-save-settings" class="primary-btn">Lưu & Áp dụng</button>
    </div>
  </div>

  <script src="messages.js"></script>
  <script src="capy.js"></script>
</body>
</html>
