<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <title>Capy Desktop Pet</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
    }
    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: transparent;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }
    #pet-canvas {
      position: absolute;
      top: 0;
      left: 0;
      display: block;
      width: 100vw;
      height: 100vh;
      cursor: default;
      z-index: 1;
    }
    /* Floating Vertical Dashboard Pill */
    #dashboard {
      position: fixed;
      right: 18px;
      bottom: 85px;
      z-index: 9999;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 7px;
      background: rgba(22, 18, 32, 0.86);
      backdrop-filter: blur(14px);
      -webkit-backdrop-filter: blur(14px);
      border: 1px solid rgba(255, 255, 255, 0.18);
      border-radius: 26px;
      padding: 7px 5px;
      box-shadow: 0 8px 24px rgba(0, 0, 0, 0.45), inset 0 1px 0 rgba(255, 255, 255, 0.15);
      transition: background 0.25s ease, border-color 0.25s ease, box-shadow 0.25s ease;
      cursor: grab;
    }
    #dashboard.is-dragging {
      transition: none !important;
      cursor: grabbing !important;
    }
    #dashboard:hover {
      background: rgba(28, 22, 42, 0.96);
      border-color: rgba(255, 200, 80, 0.4);
      box-shadow: 0 10px 28px rgba(0, 0, 0, 0.55);
    }
    .dash-btn {
      display: flex;
      align-items: center;
      justify-content: center;
      width: 32px;
      height: 32px;
      background: transparent;
      border: none;
      outline: none;
      color: #94a3b8;
      border-radius: 50%;
      cursor: pointer;
      transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1);
      user-select: none;
      padding: 0;
    }
    .dash-btn .icon {
      font-size: 15px;
      line-height: 1;
      transition: transform 0.2s ease;
    }
    .dash-btn:hover {
      background: rgba(255, 255, 255, 0.12);
      color: #ffffff;
      transform: scale(1.1);
    }
    .dash-btn.active {
      background: linear-gradient(135deg, #f59e0b, #d97706);
      color: #ffffff;
      box-shadow: 0 2px 10px rgba(245, 158, 11, 0.45);
      transform: scale(1.05);
    }
    .dash-btn.active.bath {
      background: linear-gradient(135deg, #06b6d4, #0284c7);
      box-shadow: 0 2px 10px rgba(6, 182, 212, 0.45);
    }
    .dash-btn.active.work {
      background: linear-gradient(135deg, #8b5cf6, #6d28d9);
      box-shadow: 0 2px 10px rgba(139, 92, 246, 0.45);
    }
    .dash-btn.feed-btn {
      color: #fb923c;
    }
    .dash-btn.feed-btn:hover {
      background: rgba(251, 146, 60, 0.22);
      color: #ffedd5;
    }
    .dash-btn.gate-btn {
      color: #c084fc;
    }
    .dash-btn.gate-btn:hover {
      background: rgba(192, 132, 252, 0.22);
      color: #faf5ff;
    }

    .dash-btn.toggle-dash {
      font-size: 13px;
      opacity: 0.65;
      margin-top: 2px;
      border-top: 1px solid rgba(255, 255, 255, 0.1);
      width: 28px;
      height: 22px;
      border-radius: 11px;
    }
    .dash-energy-container {
      width: 32px;
      height: 6px;
      background: rgba(255, 255, 255, 0.12);
      border-radius: 4px;
      padding: 1px;
      overflow: hidden;
      margin: 1px 0;
      box-shadow: inset 0 1px 2px rgba(0, 0, 0, 0.45);
      cursor: default;
    }
    .dash-energy-bar {
      height: 100%;
      width: 100%;
      border-radius: 2px;
      background: linear-gradient(90deg, #10b981, #34d399);
      transition: width 0.3s ease, background 0.3s ease;
      box-shadow: 0 0 6px rgba(52, 211, 153, 0.4);
    }
    .dash-energy-bar.warning {
      background: linear-gradient(90deg, #f59e0b, #fbbf24);
      box-shadow: 0 0 6px rgba(245, 158, 11, 0.5);
    }
    .dash-energy-bar.critical {
      background: linear-gradient(90deg, #ef4444, #f87171);
      box-shadow: 0 0 8px rgba(239, 68, 68, 0.7);
      animation: energyPulse 0.9s infinite alternate;
    }
    @keyframes energyPulse {
      0% { opacity: 0.65; }
      100% { opacity: 1; }
    }
    .dash-btn.toggle-dash:hover {
      opacity: 1;
      background: rgba(255, 255, 255, 0.12);
      transform: none;
    }
    #dashboard.collapsed {
      padding: 4px;
      gap: 0;
      border-radius: 50%;
      width: 36px;
      height: 36px;
      min-width: 36px;
      min-height: 36px;
      background: rgba(22, 18, 32, 0.88);
      border: 1px solid rgba(255, 255, 255, 0.25);
      box-shadow: 0 6px 16px rgba(0, 0, 0, 0.45);
      justify-content: center;
      align-items: center;
      overflow: hidden;
    }
    #dashboard.collapsed:hover {
      border-color: rgba(255, 200, 80, 0.6);
      transform: scale(1.08);
    }
    #dashboard.collapsed .dash-grip,
    #dashboard.collapsed #btn-roam,
    #dashboard.collapsed #btn-bath,
    #dashboard.collapsed #btn-work,
    #dashboard.collapsed #btn-feed,
    #dashboard.collapsed #btn-gate,
    #dashboard.collapsed #dash-energy {
      display: none !important;
    }
    #dashboard.collapsed .dash-btn.toggle-dash {
      margin: 0;
      border: none;
      width: 28px;
      height: 28px;
      border-radius: 50%;
      opacity: 1;
      color: #fbbf24;
      display: flex !important;
      align-items: center;
      justify-content: center;
    }
    #dashboard.collapsed .dash-btn.toggle-dash .icon {
      font-size: 16px;
    }

    .dash-grip {
      width: 24px;
      height: 12px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 2.5px;
      cursor: grab;
      padding: 2px 0;
      opacity: 0.45;
      transition: opacity 0.2s ease;
    }
    .dash-grip:hover {
      opacity: 0.95;
    }
    .dash-grip:active {
      cursor: grabbing;
    }
    .dash-grip span {
      display: block;
      width: 14px;
      height: 2px;
      background: #e2e8f0;
      border-radius: 2px;
    }
  </style>
</head>
<body>
  <canvas id="pet-canvas"></canvas>

  <div id="dashboard">
    <div class="dash-grip" id="dash-grip" title="Giữ chuột để di chuyển thanh công cụ">
      <span></span>
      <span></span>
    </div>
    <button id="btn-roam" class="dash-btn active" title="Đi dạo">
      <span class="icon">🌿</span>
    </button>
    <button id="btn-bath" class="dash-btn" title="Đi tắm">
      <span class="icon">🛁</span>
    </button>
    <button id="btn-work" class="dash-btn" title="Làm việc">
      <span class="icon">💻</span>
    </button>

    <button id="btn-feed" class="dash-btn feed-btn" title="Cho ăn">
      <span class="icon">🧺</span>
    </button>
    <div id="dash-energy" class="dash-energy-container" title="Năng lượng Capybara: 100%">
      <div id="dash-energy-bar" class="dash-energy-bar"></div>
    </div>
    <button id="btn-gate" class="dash-btn gate-btn" title="Cổng Không Gian (Phím G)">
      <span class="icon">⛩️</span>
    </button>

    <button id="btn-toggle-dash" class="dash-btn toggle-dash" title="Thu nhỏ thanh công cụ">
      <span class="icon">😣</span>
    </button>
  </div>

  <script src="messages.js"></script>
  <script src="js/effects/particles.js"></script>
  <script src="js/ui/speech-bubble.js"></script>
  <script src="js/orange-stack.js"></script>
  <script src="capy.js"></script>
  <script src="js/ui/dashboard.js"></script>
  <script src="js/water-system.js"></script>
  <script src="js/modes/mode-roam.js"></script>
  <script src="js/modes/mode-work.js"></script>
  <script src="js/modes/mode-bath.js"></script>
  <script src="js/modes/mode-hide.js"></script>
  <script src="js/wood-log.js"></script>
  <script src="js/feeding-system.js"></script>
  <script src="js/gate-system.js"></script>
</body>
</html>
